function company(id){return state.companies.find(x=>x.id===id)}function cname(id){return company(id)?.name||'Cliente não vinculado'}function userOpts(){return USERS.map(u=>[u,'@'+u])}const statuses=['A fazer','Em andamento','Aguardando cliente','Concluído'];const sectors=['Legalização','Contábil','Fiscal','Departamento Pessoal','TI','Marketing','Operação'];

function paymentStatus(p){return p.status==='Pago'?'Pago':p.due&&p.due<today()?'Atrasado':'Pendente'}function received(ps=bills()){return ps.filter(p=>p.status==='Pago').reduce((s,p)=>s+Number(p.paidAmount??p.amount),0)}function dueTotal(ps=bills()){return ps.filter(p=>p.status!=='Pago').reduce((s,p)=>s+Number(p.amount),0)}function totalExpenses(){return state.expenses.filter(e=>e.status==='Pago').reduce((s,e)=>s+Number(e.amount),0)}
function activeProcesses(){return state.processes.filter(p=>p.status!=='Concluído')}function overdue(p){return p.due&&p.due<today()&&p.status!=='Concluído'}
function render(){let generated=bills().filter(p=>String(p.id).startsWith('monthly:'));if(generated.length){state.payments.push(...generated.map(p=>({...p,id:uid(),createdAt:now(),createdBy:'Sistema local'})));save()}nav();if(hubFrame)hubFrame.style.display='none';let f={home:home,space:space,companies:companies,obligations:obligations,processes:processes,operations:operations,finance:finance,legal:legal,tools:tools,library:library,contacts:contacts,marketing:marketing,war:war,plan:plan,arsenal:()=>hub('arsenal'),playbook:()=>hub('playbook'),prices:()=>hub('precos'),channels:()=>hub('channels'),wins:wins,settings:settings};$('app').innerHTML=(f[page]||home)();if(['arsenal','playbook','prices','channels'].includes(page))mountHub();}
function home(){let ps=bills(),pending=activeProcesses(),late=pending.filter(overdue);let head=hero('VISÃO EXECUTIVA','Sua operação, em um só lugar.','Clientes, entregas e resultados conectados à rotina da SEIKA.',`<button onclick="companyForm()">+ Empresa</button><button class="primary" onclick="go('space')">Meu dia ↗</button>`)+tabs([['overview','Dashboard'],['pending','Central de Pendências'],['deadlines','Central de Prazos'],['kanban','Fluxo Operacional (Kanban)'],['history','Histórico de Entregas']]);if(sub==='kanban')return head+`<div class="notice">Funil comercial e execução no mesmo fluxo. A conversão de um lead cria o cliente e mantém seu histórico.</div>`+board();if(sub==='pending')return head+taskTable(pending);if(sub==='deadlines'){let all=[...pending.map(p=>({...p,type:'Processo'})),...state.obligations.filter(o=>o.status!=='Concluído').map(o=>({...o,name:o.title,type:'Obrigação'})),...licenseRows().filter(x=>x.due).map(x=>({...x,name:x.type,companyId:x.companyId,type:'Licença',owner:'PauloGomes'}))].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return head+`<div class="card">${table(['Entrega / licença','Cliente','Prazo','Responsável','Situação'],all.map(p=>[esc(p.name),esc(cname(p.companyId)),date(p.due),'@'+esc(p.owner||''),badge(days(p.due)<0?'Vencido':days(p.due)<=7?'Até 7 dias':'Programado',days(p.due)<0?'red':'yellow')]))}</div>`}if(sub==='history')return head+taskTable(state.processes.filter(p=>p.status==='Concluído'));let paid=received(ps),exp=totalExpenses(),newc=state.companies.filter(c=>(c.start||c.createdAt||'').slice(0,7)===month()).length;return head+`<div class="grid g4 bottomgap">${stat('RECEBIDO ACUMULADO',brl(paid),'Pagamentos efetivamente registrados')}${stat('SALDO DE CAIXA ACUMULADO',brl(paid-exp),'Recebimentos menos despesas pagas')}${stat('A RECEBER',brl(dueTotal(ps)),ps.filter(p=>paymentStatus(p)==='Atrasado').length+' cobranças atrasadas','#d1af55')}${stat('CLIENTES ATIVOS',state.companies.filter(c=>c.status==='Ativo').length,newc+' entradas neste mês')}</div><div class="split bottomgap"><div class="card"><div class="row between"><h3>Ritmo da operação</h3>${badge(pending.length+' em aberto','blue')}</div><div class="grid g3">${statuses.slice(0,3).map(s=>`<div><div class="metricslabel"><span>${s}</span><b>${state.processes.filter(p=>p.status===s).length}</b></div><div class="progress"><i style="width:${state.processes.length?state.processes.filter(p=>p.status===s).length/state.processes.length*100:0}%"></i></div></div>`).join('')}</div><div class="chartbars">${Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);let m=d.toISOString().slice(0,7),v=state.processes.filter(p=>p.completedAt?.slice(0,7)===m).length,max=Math.max(1,...Array.from({length:6},(_,j)=>state.processes.filter(p=>p.completedAt?.slice(0,7)===new Date(new Date(new Date().setDate(1)).setMonth(new Date().getMonth()-5+j)).toISOString().slice(0,7)).length));return `<div><i style="height:${v/max*100}%"></i><span>${d.toLocaleDateString('pt-BR',{month:'short'})} • ${v}</span></div>`}).join('')}</div><p class="tiny muted">Entregas concluídas por mês</p></div><div class="card"><h3>Precisa de atenção</h3>${late.slice(0,4).map(p=>`<div class="listline"><strong>${esc(p.name)}</strong><p class="tiny muted">${esc(cname(p.companyId))} • @${esc(p.owner)}</p>${badge(date(p.due),'red')}</div>`).join('')||empty('Prazos sob controle','Nenhum processo atrasado registrado.')}<button onclick="sub='pending';render()">Ver pendências →</button></div></div><div class="grid g4 bottomgap">${stat('CONCLUÍDAS',state.processes.filter(p=>p.status==='Concluído').length,'Entregas com histórico')}${stat('CLIENTES QUE PAGARAM',new Set(ps.filter(p=>p.status==='Pago').map(p=>p.companyId)).size,'Ao menos um pagamento registrado')}${stat('CLIENTES COM SALDO ABERTO',new Set(ps.filter(p=>p.status!=='Pago').map(p=>p.companyId)).size,'Mensalidades + serviços')}${stat('EX-CLIENTES',state.companies.filter(c=>c.status==='Desativado').length,'Paralisados: '+state.companies.filter(c=>c.status==='Paralisado').length)}</div><div class="notice">Mensalidades são previstas apenas para o mês atual e não representam receita recebida. Saldo de caixa não equivale a lucro contábil ou DRE. Para apuração contábil, registre competência, tributos, provisões e custos no sistema contábil.</div>`}
function table(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty()}
function taskTable(arr){return `<div class="card">${table(['Serviço / atividade','Empresa','Setor','Responsável','Prazo','Situação','Valor','Ação'],arr.map(p=>[esc(p.name),esc(cname(p.companyId)),esc(p.sector),'@'+esc(p.owner),date(p.due),badge(p.status,overdue(p)?'red':p.status==='Concluído'?'green':'blue'),brl(p.final),`<button onclick="processForm('${p.id}')">Abrir</button>`]))}</div>`}
function processCard(p){return `<div class="task" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${p.id}')"><strong>${esc(p.name)}</strong><p>${esc(cname(p.companyId))}</p><div class="row">${badge(p.sector||'Comercial')}${badge('@'+p.owner,'blue')}${p.due?badge(date(p.due),overdue(p)?'red':''):''}</div>${p.tag?`<p><span class="chip" style="background:${esc(p.tagColor||'#128f9d')}">${esc(p.tag)}</span></p>`:''}<p>${brl(p.final)} • ${p.createdAt?date(p.createdAt):''}</p><div class="row"><button onclick="processForm('${p.id}')">Detalhes</button>${p.status!=='Concluído'?`<button onclick="moveProcess('${p.id}','Concluído')">✓ Concluir</button>`:''}</div></div>`}
function board(){let stages=[['Comercial',null],...statuses.map(s=>[s,s])];return `<div class="board" style="grid-template-columns:repeat(5,minmax(220px,1fr))">${stages.map(([s,status])=>`<div class="column" ondragover="event.preventDefault()" ondrop="event.preventDefault();dropProcess(event,'${s}')"><h3>${s} ${badge(s==='Comercial'?state.leads.filter(l=>!l.converted).length:state.processes.filter(p=>p.status===s).length)}</h3><div class="stack">${s==='Comercial'?state.leads.filter(l=>!l.converted).map(l=>`<div class="task"><strong>${esc(l.name)}</strong><p>${esc(l.contact)} • ${esc(l.stage||'Novo lead')}</p>${badge(l.stage||'Novo lead','blue')}<p>${esc(l.next||'Defina o próximo contato')}</p><div class="row"><button onclick="leadForm('${l.id}')">Editar</button><button onclick="convertLead('${l.id}')">Converter</button></div></div>`).join('')||empty('Sem leads'):state.processes.filter(p=>p.status===s).map(processCard).join('')||empty('Sem atividades')}</div></div>`).join('')}</div><div class="row" style="margin-top:16px"><button onclick="leadForm()">+ Lead comercial</button><button onclick="processForm()">+ Processo</button></div>`}
function dropProcess(e,status){let id=e.dataTransfer.getData('text/plain');if(status!=='Comercial')moveProcess(id,status)}function moveProcess(id,status){let p=state.processes.find(x=>x.id===id);if(!p)return;p.status=status;p.completedAt=status==='Concluído'?now():null;save('Alterou etapa para '+status,p.name);render()}
function processForm(id){let p=state.processes.find(p=>p.id===id)||{owner:user,status:'A fazer',sector:'Legalização',initial:0,discount:0,due:plusDays(7),discountType:'R$'};modal(id?'Editar processo':'Cadastrar serviço',`<div class="formgrid">${select('owner','Responsável pelo serviço',userOpts(),p.owner)}${select('sector','Setor',sectors,p.sector)}<label class="wide">Empresa / cliente<input name="companyName" list="companiesList" value="${esc(cname(p.companyId)==='Cliente não vinculado'?'':cname(p.companyId))}" placeholder="Digite as primeiras letras ou um novo nome" required oninput="fillCompanyHint(this)"><datalist id="companiesList">${state.companies.map(c=>`<option value="${esc(c.name)}">${esc(c.cnpj)}</option>`).join('')}</datalist><small id="companyHint">Um novo nome será cadastrado como cliente ao salvar.</small></label>${input('name','Serviço a realizar',p.name,'text','required')}${select('status','Etapa',statuses,p.status)}${input('initial','Valor inicial (R$)',p.initial,'number','min="0" step="0.01" oninput="calcService()" required')}${select('discountType','Desconto em',['R$','%'],p.discountType,'onchange="calcService()"')}${input('discount','Desconto',p.discount,'number','min="0" step="0.01" oninput="calcService()"')}${input('final','Valor final (R$)',p.final||0,'number','readonly')}${input('due','Prazo do serviço',p.due,'date','required')}${input('payDue','Vencimento da cobrança',p.payDue||p.due,'date','required')}${area('description','Etapas / observações',p.description)}${input('tag','Tag pessoal',p.tag,'text',id&&p.owner!==user?'disabled':'')}${input('tagColor','Cor da tag',p.tagColor||'#128f9d','color',id&&p.owner!==user?'disabled':'')}<label class="wide checkboxrow"><input type="checkbox" name="cora" ${p.coraRequested?'checked':''}> Solicitar emissão Cora após cadastrar</label><div class="notice warn wide">Sem conexão Cora, a cobrança fica registrada como pendente de emissão. Nenhum boleto fictício é gerado.</div></div>`,async d=>{let initial=+d.initial,discount=+d.discount;if(discount<0||(d.discountType==='%'&&discount>100)||(d.discountType==='R$'&&discount>initial))throw Error('O desconto deve ficar entre zero e o valor do serviço.');let paidBill=id&&state.payments.find(x=>x.processId===id&&x.status==='Pago');let proposedFinal=Math.round((initial-(d.discountType==='%'?initial*discount/100:discount))*100)/100;if(paidBill&&(Math.abs(+paidBill.amount-proposedFinal)>.009||cname(p.companyId).toLowerCase()!==d.companyName.trim().toLowerCase()))throw Error('Serviço já pago. Registre estorno antes de alterar valor ou cliente.');let c=state.companies.find(c=>c.name.toLowerCase()===d.companyName.trim().toLowerCase());if(!c){c={id:uid(),name:d.companyName.trim(),status:'Ativo',monthly:0,createdBy:user,createdAt:now(),start:today(),licenses:{}};state.companies.push(c)}let final=Math.round((initial-(d.discountType==='%'?initial*discount/100:discount))*100)/100;let item={...p,...d,id:id||uid(),companyId:c.id,initial,discount,final,createdBy:p.createdBy||user,createdAt:p.createdAt||now(),coraRequested:!!d.cora};delete item.companyName;if(id&&p.owner!==user){item.tag=p.tag;item.tagColor=p.tagColor}if(item.status==='Concluído')item.completedAt=p.completedAt||now();else item.completedAt=null;if(id)state.processes[state.processes.findIndex(x=>x.id===id)]=item;else state.processes.push(item);let bill=state.payments.find(x=>x.processId===item.id);if(bill&&bill.status!=='Pago'){bill.amount=final;bill.due=d.payDue;bill.companyId=c.id;bill.description=d.name}else if(bill&&bill.status==='Pago'&&(+bill.amount!==final||bill.companyId!==c.id)){throw Error('Este serviço já foi pago. Registre estorno ou ajuste financeiro antes de alterar seu valor/cliente.')}else if(!bill){state.payments.push({id:uid(),processId:item.id,companyId:c.id,description:d.name,amount:final,due:d.payDue,kind:'Esporádico',status:'Pendente',coraStatus:d.cora?'Pendente de integração':'Não solicitado',createdAt:now()})}save(id?'Atualizou processo':'Cadastrou serviço',item.name);closeModal();render();if(d.cora)toast('Serviço e cobrança salvos. Emissão Cora aguarda conexão.');else toast('Serviço vinculado à empresa e ao financeiro.');},'Cadastrar / salvar serviço');calcService();}
function calcService(){let f=$('modalForm');if(!f?.elements.initial)return;let a=+f.elements.initial.value,d=+f.elements.discount.value;f.elements.final.value=Math.max(0,a-(f.elements.discountType.value==='%'?a*d/100:d)).toFixed(2)}function fillCompanyHint(e){let c=state.companies.find(c=>c.name.toLowerCase()===e.value.toLowerCase());$('companyHint').textContent=c?`${c.cnpj||'CPF/CNPJ não informado'} • ${c.email||'Sem e-mail'} • ${c.phone||'Sem telefone'}`:'Novo cliente: complete seus dados na aba Empresas após cadastrar.'}
function processes(){return hero('EXECUÇÃO','Gestão de processos','Do cadastro à entrega, com responsável, prazo e cobrança vinculada.',`<button onclick="processForm()" class="primary">+ Cadastrar serviço</button>`)+`<div class="grid g4 bottomgap">${stat('CADASTRADOS',state.processes.length)}${stat('EM ANDAMENTO',state.processes.filter(p=>p.status==='Em andamento').length)}${stat('ATRASADOS',activeProcesses().filter(overdue).length)}${stat('VALOR DOS SERVIÇOS',brl(state.processes.reduce((s,p)=>s+(+p.final||0),0)))}</div><div class="toolbar"><input placeholder="Buscar serviço ou empresa" value="${esc(search)}" oninput="search=this.value;renderSearchTable()"><select id="sectorFilter" onchange="renderSearchTable()"><option value="">Todos os setores</option>${sectors.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="processTable">${taskTable(state.processes)}</div>`}

function operations(){return hero('TRANSPARÊNCIA NA EQUIPE','Operacional dos sócios','Três colunas compartilhadas. Tags e avisos pessoais pertencem ao responsável.')+`<div class="grid g3">${USERS.map(u=>{let items=state.processes.filter(p=>p.owner===u);return `<div class="column"><h3>@${u} ${badge(items.length)}</h3><select onchange="sortOps('${u}',this.value)"><option value="new">Mais recentes</option><option value="name">Nome da atividade</option><option value="due">Prazo mais próximo</option><option value="old">Data de cadastro</option></select><div class="stack" id="ops-${u}" style="margin-top:14px">${items.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(processCard).join('')||empty('Sem processos atribuídos')}</div></div>`}).join('')}</div>`}

function companies(){if(profileCompany)return companyDetail(profileCompany);return hero('CARTEIRA DE CLIENTES','Empresas','Cadastro, documentos, licenças e visão financeira de cada cliente.',`<button onclick="importData('companies')">↑ Importar arquivos</button><button class="primary" onclick="companyForm()">+ Cadastrar empresa / PF</button>`)+`<div class="toolbar"><input placeholder="Buscar nome, CNPJ, responsável ou bairro" oninput="filterCompanies(this.value)"><select id="companyStatus" onchange="filterCompanies(document.querySelector('.toolbar input').value)"><option value="">Todas as situações</option><option>Ativo</option><option>Desativado</option><option>Paralisado</option></select></div><div class="grid g3" id="companyCards">${companyCards(state.companies)}</div>`}

function companyCards(arr){return arr.map(c=>{let ps=bills().filter(p=>p.companyId===c.id);return `<div class="card"><div class="row between"><div class="toolicon">${c.photo?`<img src="${safeUrl(c.photo)}" alt="Foto da empresa">`:esc(c.name.slice(0,2).toUpperCase())}</div>${badge(c.status,c.status==='Ativo'?'green':c.status==='Desativado'?'red':'yellow')}</div><h3 style="margin:17px 0 7px">${esc(c.name)}</h3><p class="tiny muted">${esc(c.cnpj||'Documento não informado')} • ${esc(c.contact||'Sem responsável')}</p><div class="metricslabel"><span>Mensalidade</span><b>${brl(c.monthly)}</b></div><div class="metricslabel"><span>Recebido / A receber</span><b>${brl(received(ps))} / ${brl(dueTotal(ps))}</b></div><div class="progress"><i style="width:${received(ps)+dueTotal(ps)>0?received(ps)/(received(ps)+dueTotal(ps))*100:0}%"></i></div><button onclick="profileCompany='${c.id}';render()" style="width:100%">Abrir pasta do cliente →</button></div>`}).join('')||`<div class="card wide">${empty('Cadastre sua primeira empresa','Importe uma planilha ou use o cadastro manual. Os dados são editáveis.')}</div>`}
const LICENSES=['Funcionamento','Sanitário','AVCB','Meio Ambiente'];function licenseBadge(l={}){if(l.status==='Dispensado')return badge('Dispensado','blue');if(l.status==='Não se aplica')return badge('Não se aplica');if(l.due)return badge(days(l.due)<0?'Vencido':days(l.due)<=30?'Vence em '+days(l.due)+' dias':'Em dia',days(l.due)<0?'red':days(l.due)<=30?'yellow':'green');return badge(l.status||'Não informado',l.status==='Vencido'?'red':'')}
function companyForm(id){let c=company(id)||{status:'Ativo',monthly:0,payday:10,start:today(),licenses:{}};modal(id?'Editar cadastro':'Nova empresa / cliente PF',`<div class="formgrid">${input('name','Razão social / nome completo',c.name,'text','required')}${input('tradeName','Nome fantasia',c.tradeName)}${input('cnpj','CNPJ / CPF',c.cnpj)}${input('contact','Pessoa de contato',c.contact)}${input('email','E-mail',c.email,'email')}${input('phone','DDD + telefone',c.phone,'tel')}${input('address','Endereço completo',c.address)}${input('neighborhood','Bairro',c.neighborhood)}${input('city','Cidade / UF',c.city)}${input('zip','CEP',c.zip)}${input('site','Site',c.site,'url')}${input('photo','URL da foto',c.photo,'url')}${input('drive','Pasta externa de documentos (Drive)',c.drive,'url')}${select('status','Situação',['Ativo','Desativado','Paralisado'],c.status)}${input('monthly','Honorário mensal (R$)',c.monthly,'number','min="0" step="0.01"')}${input('payday','Dia de pagamento (1 a 28)',c.payday,'number','min="1" max="28"')}${input('start','Início do atendimento',c.start,'date')}${input('end','Pedido de saída / encerramento',c.end,'date')}${input('cnae','CNAE / atividades',c.cnae)}${input('regime','Regime tributário',c.regime)}${LICENSES.map((t,i)=>`${select('ls'+i,'Alvará / licença: '+t,['Não informado','Em dia','Vencido','Dispensado','Não se aplica'],c.licenses?.[t]?.status||'Não informado')}${input('ld'+i,'Validade • '+t,c.licenses?.[t]?.due,'date')}`).join('')}${area('notes','Observações do cadastro',c.notes)}</div>`,d=>{let licenses={};LICENSES.forEach((t,i)=>{licenses[t]={status:d['ls'+i],due:d['ld'+i]};delete d['ls'+i];delete d['ld'+i]});if(d.cnpj&&state.companies.some(x=>x.id!==id&&x.cnpj?.replace(/\D/g,'')===d.cnpj.replace(/\D/g,'')))throw Error('Já existe um cliente com este CPF/CNPJ.');let item={...c,...d,monthly:+d.monthly,payday:+d.payday,id:id||uid(),licenses,createdAt:c.createdAt||now(),createdBy:c.createdBy||user};if(id)state.companies[state.companies.findIndex(x=>x.id===id)]=item;else state.companies.push(item);let currentBill=state.payments.find(p=>p.key===`monthly:${item.id}:${month()}`&&p.status!=='Pago');if(currentBill&&item.status==='Ativo'&&item.monthly>0){currentBill.amount=item.monthly;currentBill.due=[month()+'-'+String(item.payday||10).padStart(2,'0'),item.start||''].sort().pop()}save(id?'Atualizou empresa':'Cadastrou empresa',item.name);closeModal();render();toast('Cadastro salvo.')})}
function companyDetail(id){let c=company(id);if(!c){profileCompany=null;return companies()}let ps=bills().filter(p=>p.companyId===id),procs=state.processes.filter(p=>p.companyId===id);setTimeout(()=>loadDocs(id),0);return hero('PASTA DO CLIENTE',esc(c.name),`${esc(c.cnpj||'CPF/CNPJ não informado')} • ${esc(c.contact||'Contato não informado')}`,`<button onclick="profileCompany=null;render()">← Voltar</button><button onclick="companyForm('${id}')">Editar cadastro</button><button class="primary" onclick="uploadDocs('${id}')">↑ Documentos</button>`)+`<div class="grid g4 bottomgap">${stat('MENSALIDADE',brl(c.monthly))}${stat('SERVIÇOS ESPORÁDICOS',brl(procs.reduce((s,p)=>s+(+p.final||0),0)),procs.length+' processos')}${stat('TOTAL RECEBIDO',brl(received(ps)))}${stat('SALDO A RECEBER',brl(dueTotal(ps)))}</div><div class="grid g2 bottomgap"><div class="card"><h3>Dados e contato</h3><p>${badge(c.status,c.status==='Ativo'?'green':c.status==='Desativado'?'red':'yellow')}</p><p>${esc(c.address||'Endereço não informado')} ${esc(c.neighborhood||'')} ${esc(c.city||'')} ${esc(c.zip||'')}</p><p class="tiny muted">CNAE: ${esc(c.cnae||'Não informado')} • ${esc(c.regime||'Regime não informado')}</p><div class="row">${contactLinks(c)}${c.site?`<a href="${safeUrl(c.site)}" target="_blank" rel="noopener">Site ↗</a>`:''}${c.drive?`<a href="${safeUrl(c.drive)}" target="_blank" rel="noopener">Pasta Drive ↗</a>`:''}</div>${audited(c)}<p>${esc(c.notes||'')}</p></div><div class="card"><h3>Licenças e regularidade</h3>${LICENSES.map(t=>`<div class="row between listline"><span>${t}</span><span>${date(c.licenses?.[t]?.due)} ${licenseBadge(c.licenses?.[t])}</span></div>`).join('')}</div></div><div class="card bottomgap"><h3>Conta do cliente • mensalidades e serviços</h3>${paymentsTable(ps)}<div class="row between" style="margin-top:15px"><span class="tiny muted">Valor inicial dos serviços: ${brl(procs.reduce((s,p)=>s+(+p.initial||0),0))} • Descontos: ${brl(procs.reduce((s,p)=>s+(+p.initial||0)-(+p.final||0),0))}</span><b>Total previsto: ${brl(ps.reduce((s,p)=>s+(+p.amount||0),0))}</b></div></div><div class="card bottomgap"><div class="row between"><h3>Drive interno do cliente</h3><button onclick="importData('license','${id}')">Extrair dados de licença</button></div><div class="notice">Arquivos guardados neste navegador (IndexedDB). Não são compartilhados entre dispositivos. Faça backup com documentos antes de trocar de computador.</div><div class="stack" id="docsList">${empty('Carregando arquivos…')}</div></div><h3>Processos do cliente</h3>${taskTable(procs)}`}
function paymentsTable(ps){return table(['Descrição','Tipo','Vencimento','Valor','Situação','Recebimento / emissão'],ps.map(p=>[esc(p.description),badge(p.kind),date(p.due),brl(p.amount),badge(paymentStatus(p),paymentStatus(p)==='Pago'?'green':paymentStatus(p)==='Atrasado'?'red':'yellow'),`<div class="row">${p.status==='Pago'?`${date(p.paidAt)} <button onclick="reversePayment('${p.id}')">Estornar</button>`:`<button onclick="pay('${p.id}')">Registrar pagamento</button>`}${p.coraStatus?badge(p.coraStatus):''}</div>`]))}
function materializeBill(id){let p=state.payments.find(x=>x.id===id);if(!p){p=bills().find(x=>x.id===id);if(p){p={...p,id:uid(),createdAt:now()};state.payments.push(p)}}return p}
function pay(id){let old=bills().find(p=>p.id===id);if(!old)return;modal('Registrar recebimento',`<div class="formgrid">${input('amount','Valor recebido (integral)',old.amount,'number','required min="0" step="0.01"')}${input('paidAt','Data do pagamento',today(),'date','required')}${select('method','Forma de pagamento',['Pix','Boleto','Transferência','Dinheiro','Cartão'])}${area('note','Referência / observação')}</div>`,d=>{if(Math.abs(+d.amount-(+old.amount))>.009)throw Error('Para pagamento parcial, divida a cobrança em lançamentos antes de quitar.');let p=materializeBill(id);Object.assign(p,{status:'Pago',paidAmount:+d.amount,paidAt:d.paidAt,method:d.method,note:d.note,receivedBy:user});save('Registrou pagamento',cname(p.companyId)+' '+brl(p.amount));closeModal();render()})}
function reversePayment(id){let p=state.payments.find(p=>p.id===id);if(!p)return;modal('Estornar registro de pagamento',area('reason','Motivo do estorno','','required'),d=>{p.status='Pendente';p.reversal={by:user,at:now(),reason:d.reason,previousPaidAt:p.paidAt};delete p.paidAmount;delete p.paidAt;save('Estornou pagamento: '+d.reason,p.description);closeModal();render()})}
function finance(){let ps=bills();return hero('FINANÇAS','Financeiro','Mensalidades, serviços e despesas com origem rastreável.',`<button onclick="expenseForm()">+ Despesa</button><button class="primary" onclick="paymentForm()">+ Lançamento</button><button onclick="exportCsv('finance')">↓ CSV</button>`)+`<div class="grid g4 bottomgap">${stat('RECEBIDO',brl(received(ps)))}${stat('A RECEBER',brl(dueTotal(ps)))}${stat('ATRASADO',brl(ps.filter(p=>paymentStatus(p)==='Atrasado').reduce((s,p)=>s+(+p.amount||0),0)),'Cobranças com vencimento passado','#cf5260')}${stat('DESPESAS PAGAS',brl(totalExpenses()))}</div>`+tabs([['overview','Todas as cobranças'],['monthly','Mensalidades'],['occasional','Serviços esporádicos'],['late','Atrasados'],['expenses','Despesas'],['departures','Saídas de clientes']])+(sub==='expenses'?`<div class="card">${table(['Descrição','Categoria','Competência','Valor','Situação'],state.expenses.map(e=>[esc(e.description),esc(e.category),date(e.due),brl(e.amount),badge(e.status,e.status==='Pago'?'green':'yellow')]))}</div>`:sub==='departures'?`<div class="card">${table(['Cliente','Situação','Pedido de saída','Saldo aberto'],state.companies.filter(c=>c.end||c.status!=='Ativo').map(c=>[esc(c.name),badge(c.status),date(c.end),brl(dueTotal(ps.filter(p=>p.companyId===c.id)))]))}</div>`:`<div class="card">${paymentsTable(ps.filter(p=>sub==='monthly'?p.kind==='Mensal':sub==='occasional'?p.kind!=='Mensal':sub==='late'?paymentStatus(p)==='Atrasado':true))}</div>`)}
function paymentForm(){modal('Novo lançamento a receber',`<div class="formgrid">${select('companyId','Cliente',state.companies.map(c=>[c.id,c.name]),'','required')}${input('description','Descrição','','text','required')}${input('amount','Valor (R$)',0,'number','required min="0.01" step="0.01"')}${input('due','Vencimento',today(),'date','required')}${select('kind','Tipo',['Esporádico','Mensal','Ajuste'])}${input('competence','Competência (se mensal)',month(),'month')}</div>`,d=>{if(!company(d.companyId))throw Error('Cadastre um cliente antes de lançar uma cobrança.');let key=d.kind==='Mensal'?`monthly:${d.companyId}:${d.competence}`:undefined;if(key&&state.payments.some(p=>p.key===key))throw Error('Mensalidade já registrada para esta competência.');state.payments.push({...d,key,id:uid(),amount:+d.amount,status:'Pendente',createdAt:now(),createdBy:user});save('Lançou cobrança',d.description);closeModal();render()})}
function expenseForm(){modal('Registrar despesa',`<div class="formgrid">${input('description','Descrição','','text','required')}${input('category','Categoria','Operacional')}${input('amount','Valor',0,'number','required min="0.01" step="0.01"')}${input('due','Data / competência',today(),'date','required')}${select('status','Situação',['Pago','Pendente'])}</div>`,d=>{state.expenses.push({...d,id:uid(),amount:+d.amount,createdBy:user,createdAt:now()});save('Registrou despesa',d.description);closeModal();render()})}
function obligations(){let list=state.obligations.filter(o=>!search||(o.title+' '+cname(o.companyId)).toLowerCase().includes(search.toLowerCase()));return hero('ROTINA E CONFORMIDADE','Obrigações','Cadastre o que precisa ser entregue. Cada ação mantém autor, data e hora.',`<button class="primary" onclick="obligationForm()">+ Obrigação</button>`)+`<div class="toolbar"><input placeholder="Pesquisar obrigações" onchange="search=this.value;render()" value="${esc(search)}"><select onchange="sub=this.value;render()"><option value="overview" ${sub==='overview'?'selected':''}>Todas</option><option value="day" ${sub==='day'?'selected':''}>Hoje</option><option value="month" ${sub==='month'?'selected':''}>Neste mês</option><option value="year" ${sub==='year'?'selected':''}>Neste ano</option></select></div><div class="card">${table(['Obrigação','Cliente','Responsável','Vencimento','Situação','Registro','Ação'],list.filter(o=>sub==='day'?o.due===today():sub==='month'?o.due?.slice(0,7)===month():sub==='year'?o.due?.slice(0,4)===today().slice(0,4):true).map(o=>[esc(o.title),esc(cname(o.companyId)),'@'+esc(o.owner),date(o.due),badge(o.status,overdue(o)?'red':o.status==='Concluído'?'green':'yellow'),`@${esc(o.createdBy)}<br><small>${esc(new Date(o.createdAt).toLocaleString('pt-BR'))}</small>`,`<button onclick="obligationForm('${o.id}')">Editar / concluir</button>`]))}</div>`}
function obligationForm(id){let o=state.obligations.find(x=>x.id===id)||{owner:user,status:'A fazer',due:today()};modal('Obrigação',`<div class="formgrid">${input('title','Título',o.title,'text','required')}${select('companyId','Cliente',[['','Interna / sem cliente'],...state.companies.map(c=>[c.id,c.name])],o.companyId)}${select('owner','Responsável',userOpts(),o.owner)}${input('due','Prazo',o.due,'date','required')}${select('status','Situação',statuses,o.status)}${area('notes','O que precisa ser entregue',o.notes)}</div>`,d=>{let item={...o,...d,id:id||uid(),createdAt:o.createdAt||now(),createdBy:o.createdBy||user,updatedBy:user,updatedAt:now()};if(id)state.obligations[state.obligations.findIndex(x=>x.id===id)]=item;else state.obligations.push(item);save('Salvou obrigação',item.title);closeModal();render()})}
function space(){let tasks=activeProcesses().filter(p=>p.owner===user).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),events=state.events.filter(e=>e.owner===user&&e.start>=today()).sort((a,b)=>a.start.localeCompare(b.start));return hero('SEU FOCO HOJE','Olá, '+(user==='MiltonAraujo'?'Milton':user==='PauloGomes'?'Paulo Gomes':'Paulo Rodrigues')+'.','Agenda, recados e decisões para avançar com clareza.',`<button onclick="syncAgenda()">↻ Sincronizar agenda</button><button class="primary" onclick="eventForm()">+ Reunião / recado</button>`)+`<div class="notice warn">Perfil local selecionado: @${user}. Não há login nem isolamento seguro entre sócios nesta versão. Agenda automática e IA privada exigem autenticação e servidor.</div><div class="grid g3 bottomgap">${stat('PROCESSOS EM ABERTO',tasks.length)}${stat('PRÓXIMOS COMPROMISSOS',events.length)}${stat('ATRASADOS',tasks.filter(overdue).length,'Priorize a renegociação dos prazos')}</div><div class="split bottomgap"><div class="card"><h3>Agenda e mensagens</h3>${events.map(e=>`<div class="task bottomgap"><div class="row between"><strong>${esc(e.title)}</strong>${badge(e.type,'blue')}</div><p>${date(e.start.slice(0,10))} às ${esc(e.start.slice(11,16))} • ${esc(cname(e.companyId))}</p><p>${esc(e.contact||'')}<br>${esc(e.address||'Endereço não informado')}<br>${esc(e.phone||'')} • ${esc(e.email||'')}</p><p>${esc(e.notes||'')}</p><div class="row">${e.link?`<a href="${safeUrl(e.link)}" target="_blank" rel="noopener">Entrar na chamada ↗</a>`:''}<button onclick="eventForm('${e.id}')">Editar</button><button onclick="downloadICS('${e.id}')">↓ Agenda (.ics)</button></div></div>`).join('')||empty('Sua agenda está livre','Cadastre reuniões, visitas, ligações e recados de clientes.')}</div><div class="card"><div class="row between"><h3>Assistente de prioridades</h3>${badge('Regras locais','blue')}</div><p class="tiny muted">Sugestões calculadas por atraso, prazo e dependência. A IA conectada pode ser habilitada em Configurações.</p><div id="priorityOutput">${tasks.slice(0,5).map((p,i)=>`<div class="listline"><b>${i+1}. ${esc(p.name)}</b><p class="tiny muted">${overdue(p)?'Prazo vencido: alinhe nova data com o cliente.':days(p.due)<=2?'Vence em até dois dias: reserve um bloco de execução.':p.status==='Aguardando cliente'?'Envie uma solicitação objetiva do documento pendente.':'Separe uma próxima ação de até 30 minutos.'}</p></div>`).join('')||empty('Nenhuma prioridade pendente')}</div><button style="margin-top:15px" onclick="aiPriorities()">Consultar IA conectada</button></div></div><div class="grid g2 bottomgap"><div class="card"><h3>Bloco de notas de @${user}</h3><textarea id="personalNotes" style="min-height:180px" placeholder="Projetos, ideias e próximos passos…">${esc(state.notes[user]||'')}</textarea><button class="primary" style="margin-top:10px" onclick="state.notes[user]=$('personalNotes').value;save('Atualizou notas pessoais',user);toast('Notas salvas neste perfil local.')">Salvar anotações</button></div><div class="card"><h3>Progresso dos projetos</h3>${sectors.map(s=>{let all=state.processes.filter(p=>p.owner===user&&p.sector===s),done=all.filter(p=>p.status==='Concluído').length;return all.length?`<div class="metricslabel"><span>${s}</span><b>${done}/${all.length} entregas</b></div><div class="progress"><i style="width:${done/all.length*100}%"></i></div>`:''}).join('')||empty('Projetos aparecerão aqui')}</div></div><h3>Minha fila de execução</h3>${taskTable(tasks)}`}
function eventForm(id){let e=state.events.find(x=>x.id===id)||{owner:user,start:today()+'T09:00',type:'Reunião'};modal('Reunião, visita ou recado',`<div class="formgrid">${input('title','Título / assunto',e.title,'text','required')}${select('type','Tipo',['Reunião','Visita','Ligação','Recado'],e.type)}${select('owner','Destinatário',userOpts(),e.owner)}${select('companyId','Cliente',[['','Não vinculado'],...state.companies.map(c=>[c.id,c.name])],e.companyId,'onchange="fillEventCompany(this.value)"')}${input('contact','Nome do contato',e.contact)}${input('start','Data e horário',e.start,'datetime-local','required')}${input('address','Endereço completo',e.address)}${input('phone','Telefone',e.phone)}${input('email','E-mail',e.email,'email')}${input('link','Link da chamada',e.link,'url')}${area('notes','Recado / pauta',e.notes)}</div>`,d=>{let item={...e,...d,id:id||uid(),createdBy:e.createdBy||user,createdAt:e.createdAt||now()};if(id)state.events[state.events.findIndex(x=>x.id===id)]=item;else state.events.push(item);save('Salvou compromisso',d.title);closeModal();render()})}
function fillEventCompany(id){let c=company(id),f=$('modalForm');if(c)for(let k of ['contact','address','phone','email'])f.elements[k].value=c[k]||''}
function downloadICS(id){let e=state.events.find(x=>x.id===id),d=e.start.replace(/[-:]/g,'')+'00',clean=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,' ');download('SEIKA-reuniao.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//SEIKA//Central//PT\r\nBEGIN:VEVENT\r\nUID:${e.id}@seika\r\nDTSTAMP:${now().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}\r\nDTSTART;TZID=America/Sao_Paulo:${d}\r\nSUMMARY:${clean(e.title)}\r\nLOCATION:${clean(e.address)}\r\nDESCRIPTION:${clean(e.notes+' '+(e.link||''))}\r\nEND:VEVENT\r\nEND:VCALENDAR`,'text/calendar')}
function contactLinks(c){let phone=(c.phone||'').replace(/\D/g,'');if(phone.length===10||phone.length===11)phone='55'+phone;return `${phone?`<a target="_blank" rel="noopener" href="https://wa.me/${phone}">WhatsApp ↗</a>`:''}${c.email?`<a href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c.email)}" target="_blank" rel="noopener">Enviar e-mail ↗</a>`:''}`}
function contacts(){return hero('RELACIONAMENTO','Contatos','Dados dos clientes cadastrados, com acesso direto ao WhatsApp e Gmail.',`<button onclick="importData('companies')">↑ Importar contatos</button><button class="primary" onclick="companyForm()">+ Contato</button>`)+`<div class="toolbar"><input placeholder="Buscar contato, empresa ou telefone" oninput="filterContacts(this.value)"></div><div class="card" id="contactTable">${contactTable(state.companies)}</div>`}

function convertLead(id){let l=state.leads.find(x=>x.id===id);if(!l||l.converted)return;let c=state.companies.find(c=>l.cnpj&&c.cnpj===l.cnpj)||state.companies.find(c=>c.name.toLowerCase()===l.name.toLowerCase());if(!c){c={...l,id:uid(),status:'Ativo',start:today(),monthly:0,licenses:l.due?{Funcionamento:{due:l.due,status:days(l.due)<0?'Vencido':'Em dia'}}:{},leadId:l.id};state.companies.push(c)}l.converted=c.id;state.processes.push({id:uid(),name:'Onboarding • '+l.name,companyId:c.id,owner:'MiltonAraujo',sector:'Operação',status:'A fazer',initial:0,discount:0,final:0,due:plusDays(3),createdAt:now(),createdBy:user});save('Converteu lead e iniciou onboarding',l.name);render();toast('Cliente cadastrado. Onboarding atribuído ao Milton.')}
const missionTemplates={PauloGomes:{daily:['Publicar ou preparar uma dica objetiva para clientes','Revisar um prazo de licença da carteira','Fazer um contato de prospecção com contexto'],weekly:['Avançar uma alteração ou regularização em andamento','Preparar duas publicações com dúvidas reais de clientes','Revisar propostas de legalização ainda abertas'],monthly:['Revisar a carteira de licenças dos próximos 60 dias','Avaliar quais conteúdos geraram conversas qualificadas']},MiltonAraujo:{daily:['Fazer um contato de prospecção ou acompanhamento','Revisar uma pendência contábil prioritária','Atualizar a próxima ação de uma oportunidade'],weekly:['Realizar duas conversas de diagnóstico com potenciais clientes','Acompanhar conversão de duas propostas sem prometer resultado','Conferir o onboarding dos clientes que entraram'],monthly:['Revisar rentabilidade e escopo dos contratos ativos','Melhorar uma etapa do onboarding com base no mês anterior']},PauloRodrigues:{daily:['Fazer um contato de prospecção ou acompanhamento','Verificar um alerta ou rotina automatizada','Resolver uma pequena melhoria técnica priorizada'],weekly:['Verificar funcionamento e backups dos sites','Automatizar uma etapa repetitiva de até uma hora','Revisar acessos e atualizações das ferramentas'],monthly:['Testar restauração de um backup','Revisar uma métrica de tempo economizado com automação']}};
function ensureMissions(){let m=month();if(state.missions.some(x=>x.cycle===m))return;let last=state.missions.filter(x=>x.done).length;for(let u of USERS){let t=missionTemplates[u];for(let scope of ['daily','weekly','monthly']){let count=scope==='daily'?new Date(+m.slice(0,4),+m.slice(5),0).getDate():scope==='weekly'?4:1;for(let n=1;n<=count;n++){let opts=t[scope],text=opts[(n-1+Math.floor(last/20))%opts.length];state.missions.push({id:uid(),cycle:m,owner:u,scope,index:n,title:text+(scope==='weekly'?' • semana '+n:''),due:scope==='daily'?m+'-'+String(n).padStart(2,'0'):scope==='weekly'?m+'-'+String(Math.min(28,n*7)).padStart(2,'0'):m+'-'+String(new Date(+m.slice(0,4),+m.slice(5),0).getDate()),done:false,createdAt:now()})}}}save('Gerou ciclo de missões',m)}
function plan(){ensureMissions();let list=state.missions.filter(x=>x.cycle===month()&&x.owner===user),done=list.filter(x=>x.done).length;let missing=state.missions.filter(x=>x.cycle<month()&&!x.done&&x.owner===user);return hero('CRESCIMENTO CONSISTENTE','Plano 30 dias','Pequenas ações por área, com renovação mensal e histórico de conclusão.',`<button onclick="openLegacyHub('plan')">Plano original do hub</button><button onclick="missionForm()">+ Missão personalizada</button>`)+`<div class="notice">Plano local baseado em regras e na função de cada sócio. O histórico é preservado; o ciclo novo é criado no primeiro acesso do mês. Rotinas essenciais se repetem. Não se trata de planejamento autônomo por IA.</div><div class="grid g3 bottomgap">${stat('CICLO ATUAL',new Date(today()+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}${stat('MINHAS CONCLUSÕES',done+' / '+list.length)}${stat('HISTÓRICO PENDENTE',missing.length,'Pendências anteriores preservadas')}</div><div class="card bottomgap"><div class="row between"><h3>@${user}</h3>${badge(Math.round(done/Math.max(1,list.length)*100)+'% do plano','green')}</div><div class="progress"><i style="width:${done/Math.max(1,list.length)*100}%"></i></div></div><div class="grid g3">${[['daily','Missões diárias'],['weekly','Missões semanais'],['monthly','Missões mensais']].map(([s,t])=>`<div class="card"><h3>${t}</h3><div class="stack">${list.filter(x=>x.scope===s&&(s!=='daily'||x.due===today()||(!x.done&&x.due<today()))).slice(-12).map(missionCard).join('')||empty('Dia em ordem')}</div></div>`).join('')}</div><h3>Resumo dos três sócios</h3><div class="grid g3">${USERS.map(u=>{let a=state.missions.filter(x=>x.cycle===month()&&x.owner===u);return `<div class="card"><b>@${u}</b><p class="tiny muted">${a.filter(x=>x.done).length} concluídas • ${a.filter(x=>!x.done&&x.due<today()).length} atrasadas</p><button onclick="missionOverview('${u}')">Ver plano do sócio</button></div>`}).join('')}</div>${missing.length?`<details class="card" style="margin-top:20px"><summary>Missões não concluídas dos meses anteriores (${missing.length})</summary>${missing.map(missionCard).join('')}</details>`:''}`}

function marketing(){let total=state.campaigns.reduce((s,c)=>s+(+c.spend||0),0),revenue=state.campaigns.reduce((s,c)=>s+(+c.revenue||0),0),leads=state.campaigns.reduce((s,c)=>s+(+c.leads||0),0);return hero('AQUISIÇÃO E MARCA','Leads Marketing','Investimento, retorno e produção de conteúdo no mesmo painel.',`<button onclick="go('war')">Ver oportunidades</button><button class="primary" onclick="campaignForm()">+ Campanha / canal</button>`)+`<div class="grid g4 bottomgap">${stat('INVESTIMENTO INFORMADO',brl(total))}${stat('RECEITA ATRIBUÍDA',brl(revenue))}${stat('ROAS',total?(revenue/total).toFixed(2)+'x':'Sem gasto','Receita atribuída ÷ investimento')}${stat('CUSTO POR LEAD',leads?brl(total/leads):'Sem leads',leads+' leads atribuídos')}</div><div class="card bottomgap"><h3>Canais e resultados</h3>${table(['Canal / campanha','Período','Investimento','Receita atribuída','Leads','Clientes','Ações'],state.campaigns.map(c=>[esc(c.name),esc(c.period),brl(c.spend),brl(c.revenue),esc(c.leads),esc(c.clients),`<div class="row">${c.url?`<a href="${safeUrl(c.url)}" target="_blank" rel="noopener">Painel ↗</a>`:''}<button onclick="campaignForm('${c.id}')">Atualizar</button></div>`]))}<p class="tiny muted">Valores manuais por campanha e período. Atualizar o registro substitui seus números; não importa gastos automaticamente nem lança despesas em duplicidade.</p></div><div class="grid g2 bottomgap"><div class="card"><h3>Conteúdo para redes</h3><label>Rede<select id="contentNetwork"><option>Instagram</option><option>TikTok</option><option>LinkedIn</option><option>Facebook</option><option>YouTube</option></select></label><label style="margin-top:12px">Tema ou notícia confirmada<input id="contentTopic" placeholder="Ex.: documentos para renovar o alvará"></label><label style="margin-top:12px">Fonte da notícia (opcional)<input id="contentSource" type="url" placeholder="https://..."></label><div class="row" style="margin-top:14px"><button class="primary" onclick="generateContent()">Gerar 3 roteiros locais</button><button onclick="newsLinks()">Pesquisar notícias ↗</button></div><p class="tiny muted">Os roteiros locais usam modelos editoriais, sem IA e sem leitura de tendências em tempo real. A conexão de notícias e IA ainda precisa ser implementada.</p></div><div class="card"><h3>Distribuição com foco</h3><p class="muted" style="line-height:1.8">Use Instagram para descoberta, LinkedIn para autoridade profissional e WhatsApp para conversas autorizadas. Reaproveite um tema por semana em formatos diferentes e acompanhe quantas conversas ele gerou.</p><h3 style="margin-top:25px">E uma conta no X?</h3><p class="tiny muted" style="line-height:1.9">Minha avaliação para a equipe enxuta da SEIKA: reserve o nome da marca e teste apenas quando houver rotina consistente nos canais atuais. Meça visitas qualificadas e contatos, não apenas alcance. Não há retorno garantido por abrir mais um canal.</p><div class="row"><button onclick="go('playbook')">Playbook</button><button onclick="go('channels')">Canais & Ads</button></div></div></div><div id="contentOutput">${state.content[0]?renderContent(state.content[0]):''}</div>`}

function generateContent(){let topic=$('contentTopic').value.trim(),network=$('contentNetwork').value,source=$('contentSource').value;if(!topic){toast('Informe um tema confirmado para gerar os roteiros.');return}let titles=[`O que muda na prática quando o assunto é ${topic}?`,`Três pontos para conferir: ${topic}`,`Uma dúvida comum sobre ${topic}`];let short=['Instagram','TikTok'].includes(network),scripts=titles.map((title,i)=>{let intro=i===0?'Antes de decidir, confira o que se aplica à sua empresa.':i===1?'Separe seus documentos e veja estes três pontos.':'Essa dúvida aparece com frequência nas conversas com empresários.';return {title,text:network==='LinkedIn'?`${title}\n\n${intro}\n\n1. Contexto: explique o problema real que o empresário enfrenta.\n2. Impacto: mostre o efeito em prazo, caixa ou rotina, com um exemplo conferido.\n3. Próxima ação: indique qual informação precisa ser revisada.\n\nNa SEIKA, organizamos esse diagnóstico com o cliente. Como sua empresa acompanha esse tema?`:network==='YouTube'?`${title}\n\nAbertura (0:00): ${intro}\nContexto (0:20): apresente a situação e a fonte oficial.\nExemplo (1:00): explique um caso ilustrativo sem dados de clientes.\nPasso a passo (2:00): documentação, prazo confirmado e responsável.\nFechamento (3:00): resuma a próxima ação e convide a enviar uma dúvida.\n\nDescrição: fonte, data de consulta e contato da SEIKA.`:short?`${title}\n\n0–3s • ${intro}\n4–15s • Mostre um documento ou uma situação cotidiana relacionada ao tema.\n16–30s • Explique uma orientação verificável e um exemplo simples.\n31–45s • Diga o que o empresário deve conferir hoje.\n\nLegenda: ${topic}. Cada empresa tem particularidades. Salve para revisar com quem acompanha sua rotina.\nCTA: envie sua dúvida para a SEIKA.\nVisual: cortes objetivos, legendas grandes e uma ideia por tela.`:`${title}\n\n${intro}\n\nExplique o tema em um parágrafo, usando um exemplo cotidiano e a fonte oficial. Evite prometer economia ou resultado sem análise.\n\nPróxima ação: confira os documentos e os prazos com o responsável pela empresa.\n\nFale com a SEIKA para organizar suas dúvidas.`}});let item={id:uid(),network,topic,source,scripts,createdAt:now(),by:user};state.content.unshift(item);save('Gerou roteiros editoriais locais',network+' '+topic);$('contentOutput').innerHTML=renderContent(item)}
function renderContent(c){return `<div class="notice warn">Rascunhos editoriais locais: complete os trechos de orientação com dados confirmados antes de publicar. Não são notícias verificadas nem promessa de viralização.</div><div class="grid g3">${c.scripts.map((s,i)=>`<div class="card"><span class="eyebrow">${esc(c.network)} • ROTEIRO ${i+1}</span><h3 style="margin-top:15px">${esc(s.title)}</h3><div class="report">${esc(s.text)}</div>${c.source?`<p><a href="${safeUrl(c.source)}" target="_blank" rel="noopener">Fonte informada ↗</a></p>`:''}<button style="margin-top:14px" onclick="copyText(state.content.find(c=>c.id==='${c.id}').scripts[${i}].text)">Copiar</button></div>`).join('')}</div>`}

lteração; necessidade de consolidação; assinaturas, visto de advogado quando aplicável e exigências específicas da Junta.</p></div></div>`}
let draftText='',draftTitle='';function contractForm(){modal('Preparação de minuta societária',`<div class="notice">Modelo-base editável para sociedade limitada. Outros tipos jurídicos ficam fora da geração automática. O instrumento só deve ser protocolado após revisão técnica.</div><div class="formgrid">${select('companyId','Preencher a partir do cliente',[['','Novo cadastro / preencher'],...state.companies.map(c=>[c.id,c.name])],'','onchange="fillContract(this.value)"')}${select('act','Ato',['Constituição','Alteração','Distrato'])}${input('ordinal','Número da alteração',1,'number','min="1"')}${select('nature','Natureza jurídica',[['206-2','Sociedade Empresária Limitada (206-2)']])}${input('name','Nome empresarial','','text','required')}${input('cnpj','CNPJ (para alteração / distrato)')}${input('nire','NIRE (para alteração / distrato)')}${input('address','Sede completa com CEP','','text','required')}${select('size','Porte',['Sem enquadramento','ME','EPP'])}${input('city','Cidade / UF','Belo Horizonte / MG','text','required')}${area('partners','Qualificação completa dos sócios (um por parágrafo)','','required placeholder="Nome, nacionalidade, estado civil e regime de bens, profissão, CPF, documento, endereço completo; dados adicionais aplicáveis."')}${area('object','Objeto social e atividades por extenso (com CNAEs)','','required')}${input('capital','Capital social (R$)',10000,'number','min="1" step="0.01" required')}${input('quotaValue','Valor de cada quota (R$)',1,'number','min="0.01" step="0.01" required')}${area('distribution','Distribuição de quotas e forma/prazo de integralização','','required placeholder="Sócio, quantidade de quotas, valor, percentual; integralização em moeda ou bens e respectivos prazos."')}${area('admins','Administrador(es), qualificação e poderes','','required')}${input('start','Início das atividades',today(),'date','required')}${input('signatureDate','Data do instrumento',today(),'date','required')}${area('changes','Cláusulas alteradas OU termos do distrato (obrigatório para esses atos)','','placeholder="Alteração: redação completa das cláusulas afetadas. Distrato: partilha, quitação, passivo, responsável pelo ativo/passivo superveniente e guarda de livros."')}${area('consolidation','Consolidação integral revisada (quando necessária)')}${area('extra','Cláusulas específicas revisadas / foro / regras de sucessão')}</div>`,d=>{if(d.act!=='Constituição'&&(!d.cnpj||!d.nire||!d.changes.trim()))throw Error('Para alteração/distrato, preencha CNPJ, NIRE e as cláusulas específicas.');if(Math.abs((+d.capital/+d.quotaValue)-Math.round(+d.capital/+d.quotaValue))>1e-6)throw Error('Capital deve ser divisível pelo valor de cada quota.');draftTitle=d.act==='Constituição'?'CONTRATO SOCIAL DE '+d.name:d.act==='Alteração'?d.ordinal+'ª ALTERAÇÃO CONTRATUAL DE '+d.name:'DISTRATO SOCIAL DE '+d.name;let base=`${draftTitle}\n\nMINUTA PARA REVISÃO TÉCNICA\n\n${d.partners}\n\n${d.act==='Constituição'?'Resolvem constituir uma sociedade empresária limitada mediante as cláusulas seguintes.':`Sócios da sociedade ${d.name}, inscrita no CNPJ sob nº ${d.cnpj}, NIRE ${d.nire}, com sede em ${d.address}, resolvem formalizar o presente instrumento.`}\n\n`;if(d.act==='Constituição')base+=`CLÁUSULA 1ª • NOME EMPRESARIAL E SEDE\nA sociedade gira sob o nome empresarial ${d.name} e tem sede em ${d.address}.\n\nCLÁUSULA 2ª • OBJETO SOCIAL\nA sociedade tem por objeto: ${d.object}.\n\nCLÁUSULA 3ª • INÍCIO E DURAÇÃO\nAs atividades terão início em ${date(d.start)}, e a duração da sociedade será por prazo indeterminado.\n\nCLÁUSULA 4ª • CAPITAL SOCIAL\nO capital social é de ${brl(d.capital)}, dividido em ${Math.round(+d.capital/+d.quotaValue)} quotas de ${brl(d.quotaValue)} cada, subscritas e integralizadas da seguinte forma:\n${d.distribution}\n\nCLÁUSULA 5ª • RESPONSABILIDADE\nA responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social.\n\nCLÁUSULA 6ª • ADMINISTRAÇÃO\n${d.admins}\n\nCLÁUSULA 7ª • EXERCÍCIO SOCIAL\nAo término de cada exercício social, em 31 de dezembro, a administração prestará contas justificadas de sua gestão e elaborará os demonstrativos contábeis legalmente exigidos. Os resultados serão destinados conforme deliberação válida dos sócios e a legislação aplicável.\n\nCLÁUSULA 8ª • DECLARAÇÃO DE DESIMPEDIMENTO\nO(s) administrador(es) declara(m), sob as penas da lei, que não está(ão) impedido(s) de exercer a administração da sociedade por lei especial ou por condenação criminal nas hipóteses legais. A declaração deverá ser confirmada pelo(s) signatário(s).\n\nCLÁUSULA 9ª • DISPOSIÇÕES ESPECÍFICAS\n${d.extra||'[Completar regras aplicáveis de deliberação, cessão de quotas, retirada, sucessão, resolução e foro.]'}\n\n${d.size!=='Sem enquadramento'?`ENQUADRAMENTO\n[Confirmar elegibilidade e inserir declaração de enquadramento como ${d.size} conforme a legislação aplicável.]\n\n`:''}`;else base+=`${d.changes}\n\n${d.consolidation?'CONSOLIDAÇÃO DO CONTRATO SOCIAL\n\n'+d.consolidation+'\n\n':''}${d.extra?d.extra+'\n\n':''}`;base+=`${d.city}, ${date(d.signatureDate)}.\n\n[Assinaturas de todos os signatários exigidos para o ato]\n\n[Nome e qualificação do advogado e visto, quando exigível]`;draftText=base;closeModal();showDraft()},'Preparar minuta editável')}
function fillContract(id){let c=company(id),f=$('modalForm');if(!c)return;for(let [a,b] of [['name','name'],['cnpj','cnpj'],['address','address'],['city','city'],['object','cnae']])f.elements[a].value=c[b]||''}
function showDraft(){modal(draftTitle,`<div class="notice warn">Minuta editável. Confira os campos entre colchetes e as cláusulas do caso concreto. A exportação não certifica conformidade jurídica.</div><textarea id="draftEditor" style="min-height:400px">${esc(draftText)}</textarea><div class="row" style="margin-top:15px"><button onclick="draftText=$('draftEditor').value;printDocument(draftTitle,draftText)" type="button">PDF / imprimir</button><button onclick="draftText=$('draftEditor').value;exportDocx(draftTitle,draftText)" type="button">Baixar Word (.docx)</button></div>`,null)}
async function exportDocx(title,text){if(!window.docx){toast('Exportador Word indisponível. Verifique sua conexão.');return}try{let {Document,Packer,Paragraph,TextRun,AlignmentType,Header,Footer,PageNumber}=docx;let paras=text.split('\n').map((t,i)=>new Paragraph({alignment:i===0?AlignmentType.CENTER:AlignmentType.JUSTIFIED,spacing:{after:t?140:80,line:320},children:[new TextRun({text:t,font:'Arial',size:i===0?27:23,bold:i===0||/^CLÁUSULA/.test(t)})]}));let doc=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1417,bottom:1134,left:1701,right:1134}}},headers:{default:new Header({children:[new Paragraph({children:[new TextRun({text:'SEIKA • Contabilidade e Consultoria',color:'128F9D',size:18})]})]})},footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:'SEIKA  |  Página ',size:16}),new TextRun({children:[PageNumber.CURRENT],size:16})]})]})},children:paras}]});download(title.replace(/[^\p{L}\p{N} -]/gu,'').slice(0,100)+'.docx',await Packer.toBlob(doc));toast('Documento Word gerado.')}catch(e){toast('Erro na exportação Word: '+e.message)}}
function printDocument(title,text){let win=window.open('','_blank');if(!win){toast('Permita a abertura da janela de impressão.');return}win.document.write(`<!doctype html><html lang="pt-BR"><head><title>${esc(title)}</title><style>@page{size:A4;margin:25mm 20mm 22mm 30mm}body{font:11pt Arial;color:#172c43;line-height:1.65}header{border-bottom:2px solid #128f9d;padding-bottom:12px;font-size:10pt;color:#128f9d}h1{font-size:16pt;text-align:center;margin:30px 0}p{white-space:pre-wrap;text-align:justify;orphans:3;widows:3}footer{font-size:9pt;color:#777;border-top:1px solid #ddd;margin-top:25px}button{margin:15px;padding:10px}@media print{button{display:none}}</style><\/head><body><button onclick="window.print()">Imprimir / Salvar como PDF</button><header>SEIKA • Contabilidade e Consultoria</header><h1>${esc(title)}</h1>${text.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}<footer>SEIKA • seikacontabilidade.com.br</footer><\/body><\/html>`);win.document.close();win.focus()}
function hub(tab){return hero('HUB COMERCIAL',({arsenal:'Arsenal & Objeções',playbook:'Playbook de Prospecção',precos:'Preços & Proposta',channels:'Canais & Ads'})[tab],'Funções e layout do hub preservados dentro da navegação vertical.')+`<div id="hubMount"></div>`}
let hubTab;function mountHub(){hubTab={arsenal:'arsenal',playbook:'playbook',prices:'precos',channels:'channels'}[page];if(!hubFrame){hubFrame=document.createElement('iframe');hubFrame.id='hubFrame';hubFrame.className='hubframe';hubFrame.title='Hub comercial SEIKA';hubFrame.srcdoc=HUB_SOURCE;hubFrame.onload=()=>{try{hubFrame.contentWindow.switchTab(hubTab)}catch(e){toast('O hub não carregou todos os recursos externos. Verifique a internet.')}}}hubFrame.style.display='block';$('hubMount').append(hubFrame);try{hubFrame.contentWindow.switchTab(hubTab)}catch{}}

window.addEventListener('message',e=>{if(e.data?.type==='seika-proposal'&&[hubFrame?.contentWindow,$('legacyHubModal')?.contentWindow].includes(e.source)){let text=String(e.data.text||'');modal('Exportar proposta comercial',`<div class="notice">Para PDF, use “Salvar como PDF” na janela de impressão. Baixe o arquivo e anexe-o no WhatsApp; o envio do anexo exige sua ação.</div><textarea id="proposalText" style="min-height:270px">${esc(text)}</textarea><div class="row" style="margin-top:15px"><button type="button" onclick="printDocument('Proposta Comercial SEIKA',$('proposalText').value)">PDF / impressão</button><button type="button" onclick="exportDocx('Proposta Comercial SEIKA',$('proposalText').value)">Word (.docx)</button></div>`,null)}});

function settings(){return hero('ADMINISTRAÇÃO','Configurações e integrações','Estado real dos recursos, backup e histórico de utilização.')+`<div class="notice warn">Esta edição é local: não há servidor, autenticação de sócios, dados compartilhados em tempo real nem segregação segura. Não use o seletor de perfil como controle de acesso.</div><div class="grid g2 bottomgap"><div class="card"><h3>Integrações a ativar em uma implantação com servidor</h3>${[['Google Agenda e Gmail','OAuth individual por sócio, leitura de agenda e autenticação.'],['Google Drive','OAuth e permissão da pasta. O link da pasta não concede acesso aos documentos.'],['Cora','Credenciais de API e certificados conforme contratação, criação idempotente de cobrança e confirmação por webhook.'],['IA e memória individual','Servidor com identidade autenticada, armazenamento segregado e credencial protegida.'],['Notícias e Ads','Fontes atuais e APIs oficiais com escopos autorizados.']].map(([t,d])=>`<div class="listline"><div class="row between"><b>${t}</b>${badge('Não conectado','yellow')}</div><p class="tiny muted">${d}</p></div>`).join('')}<a href="https://drive.google.com/drive/u/1/folders/10qlbfPjjo65P2TcII_XC2mGMm5y7v_gj" target="_blank" rel="noopener">Abrir pasta Drive informada ↗</a></div><div class="card"><h3>Preservar e transferir dados</h3><p class="tiny muted" style="line-height:1.9">O backup completo contém registros, documentos locais e estado do hub. Guarde em local protegido. A restauração substitui os dados deste navegador após confirmação.</p><div class="stack"><button onclick="backup()">↓ Backup dos cadastros (.json)</button><button onclick="backupFull()">↓ Backup completo com documentos (.zip)</button><button onclick="restoreBackup()">↑ Restaurar backup</button><button onclick="exportCsv('companies')">↓ Exportar empresas (.csv)</button><button onclick="downloadModel()">↓ Planilha-modelo de importação (.csv)</button><button onclick="openOriginal()">Abrir index original preservado</button></div><div class="notice" style="margin-top:20px">Planilhas: CSV/XLSX/XLS/ODS/TSV com mapeamento. PDF textual, DOCX, PPTX e XML: extração assistida e confirmação manual. Imagens e PDFs escaneados não têm OCR nesta edição.</div></div></div><div class="card"><h3>Trilha local de uso</h3><p class="tiny muted">Histórico informativo armazenado no navegador. Não é uma trilha de auditoria imutável.</p>${table(['Data e hora','Perfil','Ação','Referência'],state.audit.slice(0,100).map(a=>[esc(new Date(a.at).toLocaleString('pt-BR')),'@'+esc(a.user),esc(a.action),esc(a.entity)]))}</div>`}
function hubStorage(){let obj={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('SEIKA_')&&k!==KEY)obj[k]=localStorage.getItem(k)}return obj}
function backup(){download('SEIKA-backup-'+today()+'.json',JSON.stringify({schema:3,exportedAt:now(),state,hub:hubStorage()},null,2),'application/json');toast('Backup de cadastros exportado. Os documentos exigem backup completo.')}
async function backupFull(){if(!window.JSZip){toast('Recurso ZIP indisponível. Verifique a internet.');return}try{toast('Preparando backup completo…');let zip=new JSZip(),docs=await dbAll();zip.file('backup.json',JSON.stringify({schema:3,exportedAt:now(),state,hub:hubStorage(),files:docs.map(({blob,...m})=>m)}));for(let f of docs)zip.file('files/'+f.id,f.blob);download('SEIKA-backup-completo-'+today()+'.zip',await zip.generateAsync({type:'blob'}));toast('Backup completo exportado.')}catch(e){toast('Falha no backup: '+e.message)}}
function validState(s){return s&&['companies','processes','payments','obligations','leads','tools','library','missions','audit'].every(k=>Array.isArray(s[k]))}
function restoreBackup(){chooseFiles(async files=>{try{let file=files[0],b,zip;if(file.name.endsWith('.zip')){if(!window.JSZip)throw Error('Leitor ZIP indisponível.');zip=await JSZip.loadAsync(file);if(!zip.file('backup.json'))throw Error('ZIP não contém backup.json.');b=JSON.parse(await zip.file('backup.json').async('string'))}else b=JSON.parse(await file.text());if(b.schema!==3||!validState(b.state))throw Error('Backup incompatível com esta versão.');modal('Confirmar restauração',`<div class="notice warn">Este backup de ${date(b.exportedAt)} substituirá os cadastros atuais deste navegador. Documentos locais que já existem serão preservados. Exporte um backup atual antes de prosseguir.</div><p>${b.state.companies.length} empresas • ${b.state.processes.length} processos • ${b.files?.length||0} documentos no backup</p>`,async()=>{if(zip)for(let f of b.files||[]){let entry=zip.file('files/'+f.id);if(!entry)throw Error('Documento ausente no backup: '+f.name);await dbPut({...f,blob:new Blob([await entry.async('arraybuffer')],{type:f.type})})}state={...structuredClone(initial),...b.state};for(let [k,v] of Object.entries(b.hub||{}))if(k.startsWith('SEIKA_')&&k!==KEY&&typeof v==='string')localStorage.setItem(k,v);save('Restaurou backup',b.exportedAt);profileCompany=null;closeModal();hubFrame=null;render();toast('Backup restaurado.')},'Substituir dados e restaurar')}catch(e){toast(e.message)}},'.json,.zip',false)}
function exportCsv(target){let rows=target==='finance'?bills().map(p=>({cliente:cname(p.companyId),descricao:p.description,tipo:p.kind,vencimento:p.due,valor:p.amount,situacao:paymentStatus(p),pago_em:p.paidAt||''})):state.companies.map(c=>({nome:c.name,cnpj:c.cnpj,contato:c.contact,email:c.email,telefone:c.phone,endereco:c.address,bairro:c.neighborhood,cidade:c.city,mensalidade:c.monthly,situacao:c.status,validade:c.licenses?.Funcionamento?.due||''}));if(!rows.length){toast('Ainda não há dados para exportar.');return}let keys=Object.keys(rows[0]),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('SEIKA-'+target+'.csv','\uFEFF'+[keys.map(q).join(';'),...rows.map(r=>keys.map(k=>q(r[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')}
