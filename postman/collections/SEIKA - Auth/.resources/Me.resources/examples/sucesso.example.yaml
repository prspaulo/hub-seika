$kind: http-example
name: sucesso
request:
  url: '{{base_url}}/api/v1/auth/me'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: content-type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": "<uuid>",
        "name": "Paulo Gomes",
        "email": "paulo.gomes@seika.com.br",
        "role": "SOCIO"
      }
