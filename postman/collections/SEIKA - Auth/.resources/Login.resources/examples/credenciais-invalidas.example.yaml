$kind: http-example
name: 'credenciais inválidas'
request:
  url: '{{base_url}}/api/v1/auth/login'
  method: POST
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: content-type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "error": "UNAUTHORIZED",
        "message": "Credenciais inválidas"
      }
