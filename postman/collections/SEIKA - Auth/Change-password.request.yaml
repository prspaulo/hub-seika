$kind: http-request
name: 'Change password'
method: PATCH
url: '{{base_url}}/api/v1/auth/password'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{socio_password}}",
      "newPassword": "{{socio_password}}"
    }
