$kind: http-request
name: 'Add socio administrador'
method: POST
url: '{{base_url}}/api/v1/empresas/{{empresa_id}}/socios-administradores'
order: 7100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Maria das Graças Souza",
      "cpf": "12345678900"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201) {
        pm.environment.set('socio_administrador_id', pm.response.json().id);
      }
