$kind: http-example
name: sucesso
request:
  url: '{{base_url}}/api/v1/financeiro/cobrancas/{{cobranca_id}}/pagamento'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: content-type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": "<uuid>",
        "status": "PAGO",
        "statusComputado": "PAGO",
        "valor": 1350,
        "valorPago": 1350,
        "formaPagamento": "PIX"
      }
