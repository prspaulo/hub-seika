$kind: http-request
name: 'Gerar obrigacoes'
method: POST
url: '{{base_url}}/api/v1/obrigacoes/gerar'
order: 7500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "ownerId": "{{user_id}}",
      "empresaId": "{{empresa_id}}"
    }
examples: './.resources/Gerar-obrigacoes.resources/examples/'
